<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>loop</title>
		<style> 
body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #00000000; background: url(./images/starfield.gif) repeat, black; }
a { color: #A407A4; border: 1px solid #A407A4; border-radius: 100px; font-size: 20px; text-decoration: none; }
a:hover { color: #00E1BC; border: 1px solid #00E1BC; border-radius: 100px; }
#loop { background: url(./images/loop.png) top center no-repeat; background-size: contain; }
#loop a { position: absolute; inset: 0; padding-top: 500px; }
.loop { margin:8px auto; padding-bottom: 23px; position: relative; text-align: center; width: 500px; height: 500px; }
		</style>
		<script>
let seconds = 39;
let hash = window.location.hash.substring(1);
let target = hash ? hash + ".html" : "loop.html";
let timer = setInterval(function () { document.getElementById("count").textContent = seconds; if (seconds === 0) { clearInterval(timer); window.location.href = target; } seconds--; }, 1000);
		</script>
		<link href="./images/loop.png" rel="icon" type="image/png" />
	</head>
	<body>
		<div class="loop" id="loop">
			<a href="./loop.html">loop in <span id="count">40</span> seconds...</a>
		</div>
	</body>
</html>

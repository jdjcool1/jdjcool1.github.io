<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Index</title>
  <link href="css/files.css" rel="stylesheet">
</head>
<body>
  <h1 id="header">Index of <span id="location"></span></h1>
  <div id="parentDirLinkBox">
    <a id="parentDirLink" class="icon up" href="#"><span>[parent directory]</span></a>
  </div>
  <table>
    <thead>
      <tr id="theader">
        <th id="nameColumnHeader" tabindex="0" role="button">Name</th>
        <th id="sizeColumnHeader" class="detailsColumn" tabindex="0" role="button">Size</th>
        <th id="dateColumnHeader" class="detailsColumn" tabindex="0" role="button">Date modified</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="status"></div>
  <script src="js/files.js"></script>
</body>
</html>
